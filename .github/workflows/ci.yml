name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      # The graph, tools, memory and critic run against a scripted Claude backend.
      - run: uv run pytest --cov=equity_agents --cov-report=term-missing
