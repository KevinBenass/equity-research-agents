[project]
name = "equity-research-agents"
version = "0.1.0"
description = "A multi-agent equity research team on LangGraph and Claude: planner, filings researcher, quant analyst, writer and critic, with engineered context, layered memory and an evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kevin Benassuly" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "duckdb>=1.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "typer>=0.12",
    "rich>=13.7",
    "tabulate>=0.9",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
era = "equity_agents.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equity_agents"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "SIM102", "RUF005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
