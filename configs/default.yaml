universe:
  # Same coverage as filings-copilot so the two projects share a corpus.
  tickers: [AAPL, MSFT, NVDA, AMZN, GOOGL, JPM, JNJ, XOM]
  # SEC CIKs, so downloads don't depend on the ticker lookup file (it has missed XOM).
  ciks: {AAPL: "0000320193", MSFT: "0000789019", NVDA: "0001045810", AMZN: "0001018724",
         GOOGL: "0001652044", JPM: "0000019617", JNJ: "0000200406", XOM: "0000034088"}
  fiscal_years: [2022, 2023, 2024, 2025]

models:
  # Routing by role: strong model where judgment matters, fast model for tool loops.
  planner: claude-sonnet-5-5
  filings_researcher: claude-haiku-5-5
  quant_analyst: claude-haiku-5-5
  writer: claude-sonnet-5-5
  critic: claude-sonnet-5-5
  memory_extractor: claude-haiku-5-5
  prices:   # USD per million tokens; verify against the current Anthropic pricing page
    claude-haiku-5-5: {input: 1.0, output: 5.0}
    claude-sonnet-5-5: {input: 3.0, output: 15.0}
    claude-opus-5-5: {input: 5.0, output: 25.0}

orchestration:
  max_tasks: 6              # planner may not fan out wider than this
  max_worker_steps: 8       # tool-loop iterations per researcher
  max_revisions: 2          # writer <-> critic loops
  max_research_rounds: 2    # critic may send the team back for missing evidence once
  human_review: false       # pause for approval before publishing (CLI flag --review)

context:
  worker_budget_tokens: 12000     # per researcher, including tool results
  tool_result_max_chars: 4000     # longer tool outputs are truncated at the source
  keep_recent_tool_results: 3     # older ones are compacted to a one-line summary
  memory_facts_in_prompt: 20
  episodes_in_prompt: 2

tools:
  filings_api_url: http://localhost:8000   # the filings-copilot service
  sec_user_agent: "equity-research-agents (set SEC_USER_AGENT)"
  xbrl_cache_dir: data/xbrl
  sql_row_limit: 200

paths:
  memory_db: data/memory.sqlite
  checkpoints_db: data/checkpoints.sqlite
  runs_dir: runs
  eval_dir: evals
